<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RouteHire</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <i class="fa-solid fa-bus-simple"></i> Route<span>Hire</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
  </nav>

  <div class="container" style="max-width: 480px; margin: 3rem auto;">
    <div class="card" style="padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.8rem; margin-bottom: 0.4rem;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Login to access your RouteHire dashboard</p>
      </div>

      <!-- 3 Role Tabs: Driver | Operator | Admin -->
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--bg-subtle); padding: 0.35rem; border-radius: var(--radius-md); margin-bottom: 1.8rem; gap: 0.25rem;">
        <button id="driverTab" type="button" class="btn btn-sm active" style="background: var(--card-bg); color: var(--accent); font-weight: 700; border-radius: var(--radius-sm); font-size: 0.85rem;">
          <i class="fa-solid fa-id-card"></i> Driver
        </button>
        <button id="operatorTab" type="button" class="btn btn-sm" style="background: transparent; color: var(--text-muted); font-weight: 600; border-radius: var(--radius-sm); font-size: 0.85rem;">
          <i class="fa-solid fa-building"></i> Operator
        </button>
        <button id="adminTab" type="button" class="btn btn-sm" style="background: transparent; color: var(--text-muted); font-weight: 600; border-radius: var(--radius-sm); font-size: 0.85rem;">
          <i class="fa-solid fa-user-shield"></i> Admin
        </button>
      </div>

      <!-- Form -->
      <form id="loginForm">
        <input type="hidden" id="userRole" value="driver">

        <div class="form-group">
          <label id="inputLabel" class="form-label required">Mobile Number / Email</label>
          <div style="position: relative;">
            <i id="inputIcon" class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
            <input type="text" id="mobileInput" class="form-control" style="padding-left: 2.5rem;" placeholder="e.g. driver@demo.com or 9876543210" required>
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label class="form-label required" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 0.82rem;">Forgot?</a>
          </div>
          <div style="position: relative;">
            <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light);"></i>
            <input type="password" id="passwordInput" class="form-control" style="padding-left: 2.5rem;" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1rem;">Login</button>
        <button type="button" id="demoFillBtn" class="btn btn-outline-primary btn-block"><i class="fa-solid fa-wand-magic-sparkles"></i> Continue with Demo Credentials</button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="driver-register.html" style="font-weight: 600;">Create Account</a>
      </div>
    </div>
  </div>

  <footer style="text-align: center; padding: 1.5rem; color: var(--text-light); font-size: 0.85rem;">
    &copy; 2026 RouteHire Frontend Prototype
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="../../../js/login.js"></script>
</body>
</html>
