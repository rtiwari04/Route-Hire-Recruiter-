<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | RouteHire</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background: #0F172A;">

  <!-- Header Navbar -->
  <nav class="navbar" style="background: #1E293B; border-bottom: 1px solid #334155;">
    <div class="container">
      <a href="index.html" class="nav-brand" style="color: #FFFFFF;">
        <i class="fa-solid fa-bus-simple" style="color: #0066FF;"></i> Route<span style="color: #0066FF;">Hire</span> <span class="badge badge-info" style="font-size:0.7rem; background: #0066FF;">ADMIN PANEL</span>
      </a>
      <a href="../login.html" class="btn btn-outline btn-sm" style="color: #94A3B8; border-color: #334155;"><i class="fa-solid fa-arrow-left"></i> User Login</a>
    </div>
  </nav>

  <!-- Admin Login Card -->
  <div class="container" style="max-width: 450px; margin: 3rem auto;">
    <div class="card" style="padding: 2.5rem; border-radius: var(--radius-lg); background: #1E293B; border: 1px solid #334155; box-shadow: var(--shadow-lg); color: #F8FAFC;">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(0, 102, 255, 0.15); color: #0066FF; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem auto;">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 style="font-size: 1.8rem; margin-bottom: 0.4rem; color: #FFFFFF;">RouteHire Admin Login</h2>
        <p style="color: #94A3B8; font-size: 0.9rem;">Enter admin credentials to access system dashboard</p>
      </div>

      <!-- Form -->
      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label required" style="color: #CBD5E1;">Admin Email / ID</label>
          <div style="position: relative;">
            <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748B;"></i>
            <input type="email" id="adminEmailInput" class="form-control" style="padding-left: 2.5rem; background: #0F172A; border-color: #334155; color: #FFFFFF;" placeholder="admin@routehire.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label required" style="color: #CBD5E1;">Password</label>
          <div style="position: relative;">
            <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748B;"></i>
            <input type="password" id="adminPasswordInput" class="form-control" style="padding-left: 2.5rem; background: #0F172A; border-color: #334155; color: #FFFFFF;" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1rem; background: #0066FF; border: none; font-weight: 700;">
          <i class="fa-solid fa-shield-check"></i> ADMIN LOGIN
        </button>

        <button type="button" id="adminDemoFillBtn" class="btn btn-outline btn-block" style="color: #94A3B8; border-color: #334155;">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Fill Admin Demo Credentials
        </button>
      </form>

    </div>
  </div>

  <!-- Footer -->
  <footer style="text-align: center; padding: 1.5rem; color: #64748B; font-size: 0.85rem;">
    &copy; 2026 RouteHire Admin Authentication Gateway
  </footer>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
