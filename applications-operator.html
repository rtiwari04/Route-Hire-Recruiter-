<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Applications | RouteHire</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <i class="fa-solid fa-bus-simple"></i> Route<span>Hire</span>
      </a>

      <div class="nav-actions">
        <button class="btn btn-outline theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        <a href="operator-dashboard.html" class="btn btn-primary">Operator Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 1050px; margin: 3rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 2rem;">Received Driver Applications</h1>
        <p style="color: var(--text-muted);">Review candidates screened by RouteHire for your active recruitment needs.</p>
      </div>
    </div>

    <div class="card" style="padding: 1.5rem;">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Applicant Driver</th>
              <th>Requirement Title</th>
              <th>Route Knowledge</th>
              <th>Applied Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="operatorAppsContainer">
            <!-- JS Populated -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="../../../../../../opratorpage/js/applications.js"></script>
</body>
</html>
